<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <title>ConvertX</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="logo">X</div>
        <div>
          <h1>ConvertX</h1>
          <p>Simple file converter</p>
        </div>
      </div>

      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">
        ☀
      </button>
    </header>

    <main>

      <section class="hero">
        <h2>Convert your files</h2>
        <p>Fast, private and runs directly in your browser.</p>
      </section>

      <section class="type-grid">

        <button class="type-card active" data-type="image" type="button">
          <span class="type-icon">🖼️</span>
          <span class="type-name">Picture</span>
          <span class="type-desc">PNG, JPG, WEBP, BMP</span>
        </button>

        <button class="type-card" data-type="audio" type="button">
          <span class="type-icon">🎵</span>
          <span class="type-name">Audio</span>
          <span class="type-desc">Audio → WAV</span>
        </button>

      </section>

      <section id="converter" class="converter">

        <div id="fileBox" class="file-box">
          <input id="fileInput" type="file">

          <div class="upload-icon">＋</div>

          <h3>Choose a file</h3>
          <p id="fileHint">PNG, JPG, JPEG, WEBP or BMP</p>

          <button id="chooseBtn" class="primary-btn" type="button">
            Choose File
          </button>

          <div id="fileInfo" class="file-info hidden">
            <div>
              <strong id="fileName">file.png</strong>
              <span id="fileSize">0 KB</span>
            </div>

            <button id="removeBtn" class="remove-btn" type="button">
              ×
            </button>
          </div>
        </div>

        <div id="formatSection" class="format-section">

          <div class="section-title">
            <h3>Convert to</h3>
            <span id="formatLabel">Picture</span>
          </div>

          <div id="imageFormats" class="format-grid">

            <button class="format-btn active" data-format="png" type="button">
              <b>PNG</b>
              <small>Lossless</small>
            </button>

            <button class="format-btn" data-format="jpg" type="button">
              <b>JPG</b>
              <small>Photo</small>
            </button>

            <button class="format-btn" data-format="webp" type="button">
              <b>WEBP</b>
              <small>Modern</small>
            </button>

            <button class="format-btn" data-format="bmp" type="button">
              <b>BMP</b>
              <small>Bitmap</small>
            </button>

          </div>

          <div id="audioFormats" class="format-grid hidden">

            <button class="format-btn active" data-format="wav" type="button">
              <b>WAV</b>
              <small>PCM audio</small>
            </button>

          </div>

        </div>

        <button id="convertBtn" class="convert-btn" type="button" disabled>
          Convert File
        </button>

        <div id="progressArea" class="progress-area hidden">
          <div class="progress-top">
            <span id="progressText">Converting...</span>
            <span id="progressPercent">0%</span>
          </div>

          <div class="progress-track">
            <div id="progressBar"></div>
          </div>
        </div>

        <div id="resultBox" class="result-box hidden">

          <div class="success-icon">✓</div>

          <div class="result-text">
            <strong id="resultName">Converted file</strong>
            <span id="resultDetails">Ready to download</span>
          </div>

          <a id="downloadBtn" class="download-btn" href="#" download>
            Download
          </a>

        </div>

        <div id="errorBox" class="error-box hidden"></div>

      </section>

    </main>

    <footer>
      <span>ConvertX</span>
      <span>•</span>
      <span>Made by Vathana Gaming</span>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
